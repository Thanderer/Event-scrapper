services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SCRAPE_DAILY_DAYS: ${SCRAPE_DAILY_DAYS} 
      SCRAPE_BIWEEKLY_DAYS: ${SCRAPE_BIWEEKLY_DAYS} 
      SCRAPE_YEARLY_DAYS: ${SCRAPE_YEARLY_DAYS} 
      YEARLY_TRIGGER_THRESHOLD_DAYS: ${YEARLY_TRIGGER_THRESHOLD_DAYS} 
    restart: unless-stopped
    volumes:
      - ./data/images:/app/data/images

  web:
    build:
      context: web
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    restart: unless-stopped

volumes:
  db_data:
